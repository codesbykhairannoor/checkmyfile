<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | HandleMyFile</title>
  <meta name="robots" content="noindex, follow">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 3rem;
      font-weight: 900;
      color: #2563eb;
      margin: 0 0 12px 0;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 16px 0;
    }
    p {
      color: #64748b;
      line-height: 1.6;
      margin: 0 0 28px 0;
      font-size: 1.05rem;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .links {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      font-size: 0.95rem;
    }
    .links a {
      color: #2563eb;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Document Tool Not Found</h2>
    <p>The link you followed may be broken or the tool may have been moved. All document operations continue to run 100% locally in your browser.</p>
    <a href="/" class="btn">Return to All Tools</a>
    <div class="links">
      <a href="/compress-pdf">Compress PDF</a>
      <a href="/merge-pdf">Merge PDF</a>
      <a href="/split-pdf">Split PDF</a>
      <a href="/ocr-pdf">OCR PDF</a>
      <a href="/sign-pdf">Sign PDF</a>
    </div>
  </div>
</body>
</html>
